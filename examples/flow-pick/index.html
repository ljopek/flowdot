<!doctype html>
<!-- built by tools/build.js; library loaded from ../../dist/flowdot.min.js (cached across examples) -->

<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowdot — flow pick (weighted branch)</title>
<!-- ZERO authored JavaScript. The `|` flow operator is a WEIGHTED PICK: each packet takes exactly one
     branch, chosen at random by the @weights. `data-seed` makes the choice reproducible. file://. -->
<link rel="stylesheet" href="../tutorial.css">
</head>
<body>
<div class="wrap">
  <h1>flow pick — weighted branch</h1>
  <p class="sub"><code>router ~0.55 accept @0.8 | ~0.6 reject @0.2</code> — each packet takes <b>one</b> branch, chosen at random weighted 80/20. Watch ~4 of 5 go to <b>accept</b>.</p>

  <!-- ↓ this IS the diagram. boot() inserts a <canvas> after it and mounts this text. -->
  <script type="text/flow" data-flowdot data-theme-toggle data-editable data-seed="0x51F0" data-source="#src">
diagram "Flow pick — weighted 80/20" 800x300

lane inp
lane mid
lane out

# bare rails auto-distribute top→bottom in declaration order: accept on top,
# source/router centred, reject on the bottom
rail a         # accept
rail m         # source / router
rail r         # reject

node src     lane:inp rail:m                     inspect:"<b>src</b> — emits 2 packets/sec; each gets routed by a weighted pick"
node router core lane:mid rail:m sub:"80 / 20"  inspect:"<b>router</b> — weighted pick: 80% → accept, 20% → reject (seeded random)"
node accept  lane:out rail:a #emerald            inspect:"<b>accept</b> — ~80% of packets land here (@0.8 weight)"
node reject  lane:out rail:r #rose               inspect:"<b>reject</b> — ~20% of packets land here (@0.2 weight)"

edge src    -> router alpha:0.22
edge router -> accept alpha:0.18
edge router -> reject alpha:0.18

# `|` = weighted pick: one branch per packet, chosen by the @weights
flow pick rate:2 : src ~0.6 router ~0.55 accept @0.8 | ~0.6 reject @0.2
  </script>

  <p data-flow-inspector class="inspector">Hover a node to learn more.</p>
  <div class="src-label">the .flow source — edit it and the diagram updates</div>
  <textarea class="src" id="src" spellcheck="false"></textarea>
</div>

<script src="../../dist/flowdot.min.js"></script>
</body>
</html>
