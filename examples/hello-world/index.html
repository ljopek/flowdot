<!doctype html>
<!-- built by tools/build.js; library loaded from ../../dist/flowdot.min.js (cached across examples) -->

<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowdot — hello world</title>
<!-- The smallest useful Flowdot diagram, in the .flow language: two nodes, one edge, a packet
     flowing. ZERO authored JavaScript — just the library includes and the source below. Start here.
     (The imperative and IR-builder APIs are shown in docs/API.md.) Opens from file://. -->
<link rel="stylesheet" href="../tutorial.css">
</head>
<body>
<div class="wrap">
  <h1>Flowdot — hello world</h1>
  <p class="sub">the smallest diagram: a <b>node</b>, an <b>edge</b>, and a <b>flow</b> — one source → one worker.</p>

  <!-- ↓ this IS the diagram. boot() inserts a <canvas> after it and mounts this text. -->
  <script type="text/flow" data-flowdot data-theme-toggle data-editable data-source="#src">
diagram "one source → one worker" 680x240

# two bare lanes on one bare rail — no coordinates, no sizes: the layout
# auto-distributes the lanes into columns and the rail centres them vertically.
lane in
lane out

rail mid

node src  lane:in  rail:mid inspect:"<b>src</b> — the packet source; emits ~2 packets/sec into the edge"
node dst core lane:out rail:mid name:"Worker" inspect:"<b>Worker</b> — receives every packet from src and pulses on arrival"

edge src -> dst alpha:0.35

# a packet travels src → dst about twice a second (rate:2), pulsing the worker on arrival
flow f rate:2 : src ~0.9 dst
  </script>

  <p data-flow-inspector class="inspector">Hover a node to learn more.</p>
  <div class="src-label">the .flow source — edit it and the diagram updates</div>
  <textarea class="src" id="src" spellcheck="false"></textarea>
</div>

<!-- the library: renderer + builder + parser + the mount/auto-boot layer -->
<script src="../../dist/flowdot.min.js"></script>
</body>
</html>
