<!doctype html>
<!-- built by tools/build.js; library loaded from ../../dist/flowdot.min.js (cached across examples) -->

<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowdot — zones (visual grouping bands)</title>
<!-- No authored JavaScript. `zone` draws a labelled band BEHIND the nodes — pure visual grouping,
     no behaviour. Nodes sit on top; a flow crosses the bands. data-source mirrors the source below. -->
<link rel="stylesheet" href="../tutorial.css">
</head>
<body>
<div class="wrap">
  <h1>zones — visual grouping bands</h1>
  <p class="sub"><code>zone</code> is a labelled band drawn behind the nodes — it groups a region (frontend / backend / data) without affecting layout or behaviour.</p>

  <!-- ↓ this IS the diagram. boot() inserts a <canvas> after it and mounts this text. -->
  <script type="text/flow" data-flowdot data-theme-toggle data-editable data-source="#src">
diagram "Zones — visual grouping bands" 900x420

# three bare lanes on one bare rail — the layout auto-distributes them into columns
lane fe
lane be
lane da

rail mid

# zones are labelled bands drawn behind everything — grouping only, no behaviour.
# each zone just names the lane it spans → it INFERS its box (the lane's column ×
# a full-height content band). No coordinates.
zone frontend "Frontend" lane:fe #emerald
zone backend  "Backend"  lane:be #sky
zone data     "Data"     lane:da #violet

node ui   lane:fe rail:mid name:"web UI"    inspect:"<b>web UI</b> — frontend zone; user-facing layer that initiates all requests"
node api core lane:be rail:mid name:"API"   inspect:"<b>API</b> — backend zone; orchestrates requests between UI and database"
node db   lane:da rail:mid name:"database"  inspect:"<b>database</b> — data zone; zones are visual bands only, no effect on behaviour"

edge ui  -> api alpha:0.25
edge api -> db  alpha:0.25

flow f rate:2 : ui ~0.7 api ~0.7 db
  </script>

  <p data-flow-inspector class="inspector">Hover a node to learn more.</p>
  <div class="src-label">the .flow source — edit it and the diagram updates</div>
  <textarea class="src" id="src" spellcheck="false"></textarea>
</div>

<!-- the library: renderer + builder + parser + the mount/auto-boot layer -->
<script src="../../dist/flowdot.min.js"></script>
</body>
</html>
