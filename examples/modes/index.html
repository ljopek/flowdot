<!doctype html>
<!-- built by tools/build.js; library loaded from ../../dist/flowdot.min.js (cached across examples) -->

<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowdot — modes (a storm toggle)</title>
<!-- ZERO authored JavaScript. The page is a .flow source plus the library includes. It declares a
     `mode storm: spawn x4` — while active, every flow source spawns 4× faster. Flowdot.boot() renders
     the diagram AND auto-inserts a toggle button per declared mode (here: "storm"), so the toggle
     needs no page JS. `data-source="#src"` mirrors the source into the panel below. Opens from file://. -->
<link rel="stylesheet" href="../tutorial.css">
</head>
<body>
<div class="wrap">
  <h1>modes — a storm toggle</h1>
  <p class="sub">a <code>mode</code> carries effects; while active, <code>spawn xN</code> makes every flow source fire <b>N× faster</b>. Click <b>storm</b> below (auto-rendered by the library) to feel the surge.</p>

  <!-- ↓ this IS the diagram. boot() inserts a <canvas>, then a toggle button per declared mode. -->
  <script type="text/flow" data-flowdot data-theme-toggle data-editable data-source="#src">
diagram "Modes — a storm toggle" 720x340

# a burst mode: while active, sources spawn 4× faster (rate 1/s → 4/s)
mode storm: spawn x4

node producer box lane:src rail:r0 inspect:"<b>producer</b> — emits 1 packet/sec normally; 4/sec in storm mode"
node consumer box lane:dst rail:r0 inspect:"<b>consumer</b> — receives all packets; toggle storm to feel the surge"

road producer ~> consumer

flow f rate:1 : producer ~0.8 consumer
  </script>

  <p data-flow-inspector class="inspector">Hover a node to learn more.</p>
  <div class="src-label">the .flow source — edit it and the diagram updates</div>
  <textarea class="src" id="src" spellcheck="false"></textarea>
</div>

<!-- the library: renderer + builder + parser + the mount/auto-boot layer -->
<script src="../../dist/flowdot.min.js"></script>
</body>
</html>
