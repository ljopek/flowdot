<!doctype html>
<!-- built by tools/build.js; library loaded from ../../dist/flowdot.min.js (cached across examples) -->

<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowdot — flow fan-out (a copy to every branch)</title>
<!-- ZERO authored JavaScript. The `&` flow operator is a FAN-OUT: every packet is copied to EVERY
     branch (one publisher → all subscribers). Contrast with `|` (pick one). data-source below. file://. -->
<link rel="stylesheet" href="../tutorial.css">
</head>
<body>
<div class="wrap">
  <h1>flow fan-out — a copy to every branch</h1>
  <p class="sub"><code>pub ~0.6 subA &amp; ~0.6 subB &amp; ~0.6 subC</code> — each packet is copied to <b>every</b> branch. One publish reaches all three subscribers at once.</p>

  <!-- ↓ this IS the diagram. boot() inserts a <canvas> after it and mounts this text. -->
  <script type="text/flow" data-flowdot data-theme-toggle data-editable data-source="#src">
diagram "Flow fan-out — one publisher, every subscriber" 780x360

lane inp
lane out

# three bare rails auto-distribute into even bands; the publisher centres on the middle one
rail top
rail mid
rail bot

node pub  core lane:inp rail:mid name:"publisher" inspect:"<b>publisher</b> — fan-out source; every packet is copied to ALL subscribers"
node subA  lane:out rail:top name:"sub A"         inspect:"<b>sub A</b> — receives a copy of every published packet"
node subB  lane:out rail:mid name:"sub B"         inspect:"<b>sub B</b> — receives a copy of every published packet"
node subC  lane:out rail:bot name:"sub C"         inspect:"<b>sub C</b> — receives a copy of every published packet"

edge pub -> subA alpha:0.18
edge pub -> subB alpha:0.18
edge pub -> subC alpha:0.18

# `&` = fan-out: a copy of the packet to every branch
flow fan rate:2 : pub ~0.6 subA & ~0.6 subB & ~0.6 subC
  </script>

  <p data-flow-inspector class="inspector">Hover a node to learn more.</p>
  <div class="src-label">the .flow source — edit it and the diagram updates</div>
  <textarea class="src" id="src" spellcheck="false"></textarea>
</div>

<script src="../../dist/flowdot.min.js"></script>
</body>
</html>
